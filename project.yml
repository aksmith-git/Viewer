name: Viewer
options:
  bundleIdPrefix: com.adriansmith
  deploymentTarget:
    iOS: "17.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  Viewer:
    type: application
    platform: iOS
    sources:
      - path: Viewer
        excludes: [Resources/hljs]
      - path: Viewer/Resources/hljs
        type: folder
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    info:
      path: Viewer/Info.plist
      properties:
        CFBundleDisplayName: Viewer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UIFileSharingEnabled: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.item, public.content, public.data, public.folder, public.directory]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.adriansmith.viewer
      DEVELOPMENT_TEAM: 77STY5BM38
      TARGETED_DEVICE_FAMILY: "1,2"
      SWIFT_VERSION: "5.0"
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ViewerTests
        excludes: [Fixtures]
      - path: ViewerTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Viewer
    settings:
      GENERATE_INFOPLIST_FILE: YES
      DEVELOPMENT_TEAM: 77STY5BM38
schemes:
  Viewer:
    build:
      targets: {Viewer: all, ViewerTests: [test]}
    test:
      targets: [ViewerTests]
